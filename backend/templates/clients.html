<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global Link · Clients · Marketing Field Task Manager</title><style>body{font:16px system-ui;background:#f3f6fa;color:#20324b;margin:0}main{max-width:1000px;margin:32px auto;padding:24px;background:white;border-radius:16px}a{color:#1558a6}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:14px;border-bottom:1px solid #ddd}.table{overflow:auto}</style><link rel="stylesheet" href="{{ url_for('static', filename='branding.css') }}"></head><body><main>{% include 'company_brand.html' %}<a href="{{url_for('admin.dashboard')}}">← Dashboard</a><h1>Clients</h1><div class="table"><table><thead><tr><th>Name</th><th>Contact</th><th>Mobile</th><th>PIN</th></tr></thead><tbody>{% for c in clients %}<tr><td><a href="{{url_for('admin.web_client',client_id=c.id)}}">{{c.business_name}}</a></td><td>{{c.contact_person}}</td><td>{{c.mobile}}</td><td>{{c.pin_code or '—'}}</td></tr>{% else %}<tr><td colspan="4">No clients yet.</td></tr>{% endfor %}</tbody></table></div></main></body></html>
