<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global Link · Admin Login · Marketing Field Task Manager</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{min-height:100vh;display:grid;place-items:center;background:#eef3ef;font-family:system-ui}.login{width:min(420px,calc(100% - 32px));background:#fff;padding:38px;border-radius:18px;box-shadow:0 20px 60px #173a2e22}.mark{width:55px;height:55px;display:grid;place-items:center;background:#164c3c;color:white;border-radius:15px;font-weight:800;margin-bottom:22px}h1{font-family:Georgia;font-size:28px}.btn{background:#164c3c;border:0;padding:12px}.form-control{padding:12px}.hint{font-size:11px;color:#75837f}</style><link rel="stylesheet" href="{{ url_for('static', filename='branding.css') }}"></head><body><form class="login" method="post">{% include 'company_brand.html' %}<p class="text-secondary">Sign in with an authorized Admin, Manager or HR account.</p>{% if message %}<div class="alert alert-danger py-2">{{message}}</div>{% endif %}<label class="form-label mt-3">Username</label><input class="form-control" name="username" value="admin" required><label class="form-label mt-3">Password</label><input class="form-control" type="password" name="password" value="Admin@123" required><button class="btn btn-success w-100 mt-4">Sign in</button><p class="hint text-center mt-3 mb-0">DEMO credentials must be changed before production.</p></form></body></html>
